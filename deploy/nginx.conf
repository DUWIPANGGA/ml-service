# Ngingu ML Service — reverse proxy nginx.
#
#   Instal:
#     sudo cp deploy/nginx.conf /etc/nginx/conf.d/ngingu-ml.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# WAJIB: service tidak punya autentikasi. Selalu taruh nginx di depannya dan
# jangan buka port 8009 ke publik (lihat deploy/ml-service.service — unit sudah
# mengikat 127.0.0.1).

upstream ngingu_ml {
    server 127.0.0.1:8009;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name ml.ngingu.id;

    # ssl_certificate     /etc/letsencrypt/live/ml.ngingu.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ml.ngingu.id/privkey.pem;

    # API.md §2.7: maksimum 10 MB per gambar + overhead multipart.
    client_max_body_size 12m;

    # Prediksi + GradCAM realistis 10-20 detik (GradCAM ±10 detik per foto).
    # Naikkan bila PREDICT_TIMEOUT_SECONDS dinaikkan.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;

    # Jangan ekspos Swagger/OpenAPI ke publik di produksi.
    location = /docs      { return 404; }
    location = /redoc     { return 404; }
    location = /openapi.json { return 404; }

    location / {
        proxy_pass http://ngingu_ml;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

# Bila tetap harus diekspos (mis. backend di mesin lain), aktifkan basic auth:
#
